  <!-- ===== SPLASH v57 (inline: se pinta ANTES de descargar cualquier JS) =====
       Anillo de progreso circular con trazo REAL que sigue al avance, logo
       con respiración sutil, brillo de barrido, nombre con subrayado animado
       y fundido de salida. Solo CSS (rápido de pintar). v61: rediseño más
       vivo y compacto — el anillo ahora COMPLETA su giro con el progreso
       real y late mientras carga. -->
  <style>
    #edrSplash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:radial-gradient(120% 120% at 50% 0%,#151515 0%,#0d0d0d 55%,#0a0a0a 100%);color:#e8e8e8;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;transition:opacity .38s ease,transform .38s ease}
    #edrSplash.done{opacity:0;transform:scale(1.02);pointer-events:none}
    #edrSplash .sp-wrap{position:relative;width:96px;height:96px;display:flex;align-items:center;justify-content:center}
    #edrSplash .sp-ring{position:absolute;inset:0;border-radius:50%;
      background:conic-gradient(#e05555 calc(var(--sp,0)*1%),rgba(255,255,255,.08) 0);
      -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 calc(100% - 5px));
      mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 calc(100% - 5px));
      transition:background .25s ease;animation:sp-beat 1.6s ease-in-out infinite}
    @keyframes sp-beat{0%,100%{filter:brightness(1)}50%{filter:brightness(1.35)}}
    #edrSplash .sp-ring::after{content:'';position:absolute;inset:-10px;border-radius:50%;
      box-shadow:0 0 34px rgba(224,85,85,.28);opacity:0;animation:sp-halo 1.6s ease-in-out infinite}
    @keyframes sp-halo{50%{opacity:1}}
    #edrSplash .sp-logo{width:78px;height:78px;border-radius:20px;position:relative;overflow:hidden;background:linear-gradient(145deg,#1f1f1f,#141414);border:1px solid rgba(255,255,255,.09);box-shadow:0 12px 40px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;color:#e05555}
    #edrSplash .sp-logo::after{content:'';position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.16) 50%,transparent 60%);transform:translateX(-120%);animation:sp-shine 2s ease-in-out infinite}
    @keyframes sp-shine{55%,100%{transform:translateX(120%)}}
    #edrSplash .sp-logo svg{width:46px;height:46px;animation:sp-pulse 1.6s ease-in-out infinite;filter:drop-shadow(0 2px 10px rgba(224,85,85,.5))}
    @keyframes sp-pulse{0%,100%{transform:scale(1)}50%{transform:scale(.94)}}
    #edrSplash .sp-name{font-size:27px;font-weight:800;letter-spacing:.5px;background:linear-gradient(90deg,#fff 40%,#e05555 90%);-webkit-background-clip:text;background-clip:text;color:transparent;position:relative;padding-bottom:8px}
    #edrSplash .sp-name::after{content:'';position:absolute;left:50%;bottom:0;width:0;height:2.5px;border-radius:2px;background:linear-gradient(90deg,#e05555,#fff);transform:translateX(-50%);animation:sp-underline 1.4s ease-out .25s forwards}
    @keyframes sp-underline{to{width:74%}}
    #edrSplash .sp-row{display:flex;align-items:center;gap:10px;margin-top:2px}
    #edrSplash .sp-msg{font-size:12.5px;color:#a8a8a8;min-height:16px;letter-spacing:.3px}
    #edrSplash .sp-pct{font-size:11px;font-weight:700;color:#e05555;font-variant-numeric:tabular-nums;letter-spacing:.8px;padding:2px 8px;border-radius:999px;background:rgba(224,85,85,.12);border:1px solid rgba(224,85,85,.3)}
    #edrSplash .sp-ver{position:absolute;bottom:20px;font-size:10.5px;color:#5a5a5a;letter-spacing:1.5px}
    @media (prefers-reduced-motion:reduce){#edrSplash .sp-ring,#edrSplash .sp-logo::after,#edrSplash .sp-logo svg,#edrSplash .sp-ring::after,#edrSplash .sp-name::after{animation:none}}
  </style>
</head>
<body>

      <span class="sp-pct" id="spPct">0%</span>

  <script src="js/install.min.js?v=68" defer></script>
  <script src="js/ui.min.js?v=68"></script>
  <script src="js/views.min.js?v=68"></script>
  <script src="js/notify.min.js?v=68" defer></script>
  <script src="js/app.min.js?v=68"></script>
  <script>
    // ====== Service Worker + auto-actualización (v40) ======
    // La app se actualiza sola: al abrir, al recuperar conexión, al
    // volver al primer plano (lo típico en móvil) y cada 6 h con la app
    // abierta. El SW nuevo se activa de inmediato (SKIP_WAITING), borra
    // la caché vieja, recarga y muestra el aviso de versión nueva.
    (function(){
      if (!('serviceWorker' in navigator)) return;
      var hadController = !!navigator.serviceWorker.controller;
      var reloaded = false;

      navigator.serviceWorker.addEventListener('controllerchange', function(){
        // Solo recarga si este documento YA estaba controlado por un SW
        // anterior (evita el flash de la primera instalación) y no está
        // en medio de rellenar un formulario.
        if (reloaded || !hadController) return;
        var busy = document.querySelector('.modal:not(.hidden) form, .form-sheet:not(.hidden) form, form.dirty');
        if (busy){
          try{ UI.toast('✓ Nueva versión descargada. Se aplicará al cerrar esta pantalla.'); }catch(_){}
          return;
        }
        reloaded = true;
        try{ UI.toast('⟳ Nueva versión — actualizando…'); }catch(_){}
        setTimeout(function(){ location.reload(); }, 700);
      });

      window.addEventListener('load', function(){
        var regPromise = navigator.serviceWorker.register('sw.js', {updateViaCache:'none'}).then(function(reg){
          if (reg.waiting && navigator.serviceWorker.controller) reg.waiting.postMessage('SKIP_WAITING');
          reg.addEventListener('updatefound', function(){
            var nw = reg.installing;
            if (!nw) return;
            nw.addEventListener('statechange', function(){
              if (nw.state === 'installed' && navigator.serviceWorker.controller) nw.postMessage('SKIP_WAITING');
            });
          });
          return reg;
        }).catch(function(){ return null; });
        regPromise.then(function(reg){ if (reg) reg.update(); });

        function checkForUpdate(reg){ if (reg) reg.update(); }
        // Sondeo: al recuperar red / al volver al primer plano / cada 6 h
        window.addEventListener('online', function(){ regPromise.then(checkForUpdate); });
        document.addEventListener('visibilitychange', function(){
          if (document.visibilityState === 'visible') regPromise.then(checkForUpdate);
        });
        setInterval(function(){ regPromise.then(checkForUpdate); }, 6*60*60*1000);

        // Aviso "actualizada": compara la versión del SW activo con la
        // última que vio este dispositivo (localStorage).
        var tries = 0;
        function checkVersion(){
          var sw = navigator.serviceWorker.controller;
          if (!sw){
            if (++tries < 5) setTimeout(checkVersion, 1500);
            return;
          }
          var seen = null;
          try{ seen = localStorage.getItem('edr_sw_v'); }catch(_){}
          var onv = function(e){
            if (!e.data || e.data.type !== 'VERSION') return;
            navigator.serviceWorker.removeEventListener('message', onv);
            if (e.data.v && seen && String(seen) !== String(e.data.v)){
              try{ UI.toast('✓ App actualizada a la versión ' + e.data.v); }catch(_){}
            }
            try{ localStorage.setItem('edr_sw_v', String(e.data.v)); }catch(_){}
          };
          navigator.serviceWorker.addEventListener('message', onv);
          sw.postMessage('GET_VERSION');
        }
        checkVersion();
      });
    })();
  </script>
